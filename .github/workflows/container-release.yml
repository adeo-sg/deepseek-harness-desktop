# Build the Web container as an offline archive, prove that archive starts,
# and attach it with the deployment assets to the matching GitHub Release.
name: Release (container)

on:
  push:
    tags: ['dsh-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version to package (use the package.json version)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  package:
    name: Package offline Web image (no registry push)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      stable: ${{ steps.version.outputs.stable }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve release version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$DISPATCH_VERSION" ]]; then
            version="$DISPATCH_VERSION"
          else
            version="${GITHUB_REF_NAME#dsh-v}"
          fi
          manifest_version="$(node -p "require('./package.json').version")"
          test "$version" = "$manifest_version" || {
            echo "release version $version does not match package.json $manifest_version" >&2
            exit 1
          }
          stable=true
          [[ "$version" == *-* ]] && stable=false
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install release tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify deployment assets
        run: pnpm run verify:container

      - name: Package deployment assets
        run: pnpm run release:pack-container --out dist/container --image-repository localhost/deepseek-harness

      - uses: docker/setup-buildx-action@v3

      - name: Build offline image archive (no registry push)
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          image_tar="dsh-container-image-${RELEASE_VERSION}-linux-amd64.tar"
          image_archive="${image_tar}.gz"
          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64 \
            --tag "localhost/deepseek-harness:${RELEASE_VERSION}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${RELEASE_VERSION}" \
            --output "type=docker,dest=dist/container/${image_tar}" \
            .
          gzip -n "dist/container/$image_tar"
          (
            cd dist/container
            sha256sum "$image_archive" > "$image_archive.sha256"
            sha256sum --check "$image_archive.sha256"
          )
          gzip -dc "dist/container/$image_archive" | docker load

      - name: Verify and extract deployment archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          archive="dsh-container-${RELEASE_VERSION}.tar.gz"
          (
            cd dist/container
            sha256sum --check "$archive.sha256"
          )
          rm -rf "dist/container/dsh-container-${RELEASE_VERSION}" dist/container/extracted
          mkdir -p dist/container/extracted
          tar -xzf "dist/container/$archive" -C dist/container/extracted
          pnpm run release:verify-container-bundle \
            --root "dist/container/extracted/dsh-container-${RELEASE_VERSION}" \
            --version "$RELEASE_VERSION" \
            --image "localhost/deepseek-harness:${RELEASE_VERSION}"

      - name: Smoke packaged Compose deployment
        shell: bash
        env:
          DEEPSEEK_API_KEY: test-only
        run: |
          set -euo pipefail
          project="dsh-container-${GITHUB_RUN_ID}"
          compose_file="dist/container/extracted/dsh-container-${{ steps.version.outputs.version }}/docker-compose.yml"
          cleanup() {
            docker compose --project-name "$project" --file "$compose_file" logs --no-color 2>&1 || true
            docker compose --project-name "$project" --file "$compose_file" down --volumes --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker compose --project-name "$project" --file "$compose_file" up --detach --wait --wait-timeout 120
          curl --fail --show-error --silent http://127.0.0.1:4080/ >/dev/null
          docker compose --project-name "$project" --file "$compose_file" exec --no-TTY dsh \
            sh -c 'printf release-smoke > /data/.release-smoke-marker'
          docker compose --project-name "$project" --file "$compose_file" restart dsh
          docker compose --project-name "$project" --file "$compose_file" up --detach --wait --wait-timeout 120
          docker compose --project-name "$project" --file "$compose_file" exec --no-TTY dsh \
            sh -c 'test "$(cat /data/.release-smoke-marker)" = release-smoke'

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: dsh-container-${{ steps.version.outputs.version }}
          path: |
            dist/container/*.tar.gz
            dist/container/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dsh-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh-container-${{ needs.package.outputs.version }}
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ needs.package.outputs.stable != 'true' }}
          make_latest: false
