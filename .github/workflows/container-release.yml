# Build and publish the Web container independently from the npm release
# sequence. A dsh-v<version> tag names both artifacts; its GitHub Release keeps
# the deployment bundle and checksum while Actions retains the full CI output.
name: Release (container)

on:
  push:
    tags: ['dsh-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Image version to publish (use the package.json version)
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '24'

jobs:
  publish:
    name: Build and publish Web image
    runs-on: ubuntu-24.04
    outputs:
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve release version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$DISPATCH_VERSION" ]]; then
            version="$DISPATCH_VERSION"
          else
            version="${GITHUB_REF_NAME#dsh-v}"
          fi
          manifest_version="$(node -p "require('./package.json').version")"
          test "$version" = "$manifest_version" || {
            echo "release version $version does not match package.json $manifest_version" >&2
            exit 1
          }
          stable=true
          [[ "$version" == *-* ]] && stable=false
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          {
            echo 'tags<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/deepseek-harness:${{ steps.version.outputs.version }}"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/deepseek-harness:sha-${GITHUB_SHA}"
            if [[ "${{ steps.version.outputs.stable }}" == true ]]; then
              echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/deepseek-harness:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install release tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify deployment assets
        run: pnpm run verify:container

      - name: Package deployment assets
        run: pnpm run release:pack-container -- --out dist/container --image-repository "ghcr.io/${GITHUB_REPOSITORY_OWNER}/deepseek-harness"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/amd64
          tags: dsh-container-smoke:${{ github.sha }}
          cache-from: type=gha,scope=container
          cache-to: type=gha,scope=container,mode=max

      - name: Smoke Web container
        shell: bash
        run: |
          set -euo pipefail
          container=dsh-container-smoke
          cleanup() {
            docker logs "$container" 2>&1 || true
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "$container" "dsh-container-smoke:${GITHUB_SHA}"
          for attempt in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            if [[ "$status" == healthy ]]; then
              exit 0
            fi
            if [[ "$status" == unhealthy ]]; then
              echo 'container health check failed' >&2
              exit 1
            fi
            sleep 2
          done
          echo 'container did not become healthy within 120 seconds' >&2
          exit 1

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/dsh-v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: startsWith(github.ref, 'refs/tags/dsh-v')
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=container
          cache-to: type=gha,scope=container,mode=max

      - name: Verify public package and anonymous pull
        if: startsWith(github.ref, 'refs/tags/dsh-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner_type="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.owner.type')"
          case "$owner_type" in
            Organization)
              endpoint="orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/deepseek-harness"
              ;;
            User)
              endpoint="users/${GITHUB_REPOSITORY_OWNER}/packages/container/deepseek-harness"
              ;;
            *)
              echo "unsupported repository owner type: $owner_type" >&2
              exit 1
              ;;
          esac
          visibility="$(gh api "$endpoint" --jq '.visibility')"
          if [[ "$visibility" != public ]]; then
            echo 'GHCR created the package as private. An organization or package administrator must make deepseek-harness public in GitHub package settings, then rerun this workflow.' >&2
            exit 1
          fi
          docker logout ghcr.io
          docker pull "ghcr.io/${GITHUB_REPOSITORY_OWNER}/deepseek-harness:${{ steps.version.outputs.version }}"

      - name: Record image digest
        if: startsWith(github.ref, 'refs/tags/dsh-v')
        shell: bash
        run: |
          printf 'image=ghcr.io/%s/deepseek-harness:%s\n' "$GITHUB_REPOSITORY_OWNER" "${{ steps.version.outputs.version }}" > dist/container/image.txt
          printf 'digest=%s\n' "${{ steps.image.outputs.digest }}" >> dist/container/image.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-container-${{ steps.version.outputs.version }}
          path: dist/container
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish deployment bundle
    if: startsWith(github.ref, 'refs/tags/dsh-v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-container-*
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ needs.publish.outputs.stable != 'true' }}
          make_latest: false
