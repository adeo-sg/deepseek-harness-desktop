# Build the Web container once, prove that it starts, and attach the saved
# image plus deployment assets to the matching dsh GitHub Release.
name: Release (container)

on:
  push:
    tags: ['dsh-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version to package (use the package.json version)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  package:
    name: Build and package Web image
    runs-on: ubuntu-24.04
    outputs:
      stable: ${{ steps.version.outputs.stable }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve release version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$DISPATCH_VERSION" ]]; then
            version="$DISPATCH_VERSION"
          else
            version="${GITHUB_REF_NAME#dsh-v}"
          fi
          manifest_version="$(node -p "require('./package.json').version")"
          test "$version" = "$manifest_version" || {
            echo "release version $version does not match package.json $manifest_version" >&2
            exit 1
          }
          stable=true
          [[ "$version" == *-* ]] && stable=false
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install release tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify deployment assets
        run: pnpm run verify:container

      - name: Package deployment assets
        run: pnpm run release:pack-container --out dist/container --image-repository localhost/deepseek-harness

      - uses: docker/setup-buildx-action@v3

      - name: Build release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/amd64
          tags: localhost/deepseek-harness:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=container-amd64
          cache-to: type=gha,scope=container-amd64,mode=max

      - name: Save and reload release image
        shell: bash
        run: |
          set -euo pipefail
          filename="dsh-container-image-${{ steps.version.outputs.version }}-linux-amd64.tar.gz"
          docker save "localhost/deepseek-harness:${{ steps.version.outputs.version }}" | gzip -n > "dist/container/$filename"
          (
            cd dist/container
            sha256sum "$filename" > "$filename.sha256"
            sha256sum --check "$filename.sha256"
          )
          docker image rm "localhost/deepseek-harness:${{ steps.version.outputs.version }}"
          gzip -dc "dist/container/$filename" | docker load

      - name: Smoke packaged Web container
        shell: bash
        run: |
          set -euo pipefail
          container="dsh-container-${GITHUB_RUN_ID}"
          cleanup() {
            docker logs "$container" 2>&1 || true
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "$container" "localhost/deepseek-harness:${{ steps.version.outputs.version }}"
          for attempt in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            if [[ "$status" == healthy ]]; then
              exit 0
            fi
            if [[ "$status" == unhealthy ]]; then
              echo 'container health check failed' >&2
              exit 1
            fi
            sleep 2
          done
          echo 'container did not become healthy within 120 seconds' >&2
          exit 1

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: dsh-container-${{ steps.version.outputs.version }}
          path: |
            dist/container/*.tar.gz
            dist/container/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dsh-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh-container-${{ needs.package.outputs.version }}
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ needs.package.outputs.stable != 'true' }}
          make_latest: false
