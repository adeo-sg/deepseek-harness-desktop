# The dsh-desktop-app bundle patch: the Electron desktop surface over the web
# bundle. Applied after dsh-base and dsh-web-app, so rows here override the web
# rows by id. The desktop shell boots the same harness tree as `dsh web` with
# one swap: the HTTP webserver carrier is replaced by the desktop carrier, and
# browser RPC rides IPC instead of HTTP/WebSocket. Zero network ports.

# ── carrier swap: HTTP webserver → desktop carrier ───────────────────────────

# The node:http webserver row is disabled; the desktop-carrier row below
# provides the same `webServer` service (routes, fallback, index taps) driven
# by the app:// protocol handler, so client-modules, frontend-static,
# ui-theme, and web-runtime mount unchanged.
- id: webserver
  disabled: true

# The web runtime keeps mounting FrontendStatic (dist serving through the
# carrier's fallback seat) but prints no URL line and registers no
# web-surface prompt section or DSH_WEB_URL variable — there is no server URL
# in a desktop shell; the desktop-app row provides the surface prompt instead.
- id: web-runtime
  config:
    printUrl: false
    surfaceContext: false
    trustedHosts: []

# The web node half stays MOUNTED: its /api route and WebSocket upgrade
# registrations land on the desktop carrier and are inert (IPC never drives
# them), but the row is what carries the connection browser half into the
# __DSH_BOOT__ graph — disabling it would remove the renderer's wire client.
# The desktop-connection row below reuses this row's HostConnectionService for
# the IPC fetch handler and provides the desktopBridge host service.
- id: connection
  config:
    trustedHosts: []

# The shared module-reload HMR row stays off; client-plugin HMR in the desktop
# shell is a later milestone (rebuild + window reload today).
- id: client-hmr
  disabled: true

- insert:
    # The desktop carrier: a webServer-service-shaped route/fallback/index-tap
    # registry the app's app:// protocol handler drives per request. host/port
    # are informational (no socket is ever opened).
    - id: desktop-carrier
      name: '@deepseek-ai/dsh-host-desktop-carrier'
      config:
        host: '127.0.0.1'
        port: 0

    # The desktop node half: provides `desktopBridge` (unary/respond fetch
    # handler + mux/host event stream openers) plus the `connection` host
    # service; the Electron main process wires them to IPC.
    - id: desktop-connection
      name: '@deepseek-ai/dsh-client-connection/desktop'

    # Desktop surface glue: the harness-source section plus the desktop-surface
    # prompt section describing this shell to the model.
    - id: desktop-app
      name: '@deepseek-ai/dsh-desktop-app'

    # Custom window controls for the frameless shell: the minimize/maximize/
    # close cluster right of the Session-log utility plus a floating top-right
    # fallback while no Session header is shown. Web rows never include this
    # package, so the browser composition stays untouched.
    - id: window-controls
      name: '@deepseek-ai/dsh-client-ui-window-controls'
